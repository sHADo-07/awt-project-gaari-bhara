services:
  gaari-bhara-backend-service:
    build: .
    image: ${CONTAINER_NAME:-gaari-bhara-backend}-img:${GIT_COMMIT_HASH:-latest}
    container_name: ${CONTAINER_NAME:-gaari-bhara-backend}
    restart: always
    tty: true

    ports:
      - "${PORT:-5000}:${PORT:-5000}"

    networks:
      - app-network

    env_file: .env
    environment:
      APP_VERSION: "${GIT_COMMIT_HASH:-latest}"

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:${PORT:-5000}"]
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  app-network:
    driver: bridge
    external: true
