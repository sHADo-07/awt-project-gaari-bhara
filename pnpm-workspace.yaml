allowBuilds:
  '@nestjs/core': true
  '@scarf/scarf': true
  '@swc/core': true
  argon2: true
  msgpackr-extract: true
  unrs-resolver: true
# pnpm 10/11 read these settings from this file (not from package.json).
# Without "onlyBuiltDependencies", pnpm stops with ERR_PNPM_IGNORED_BUILDS.
overrides:
  form-data: ">=4.0.0"
  tough-cookie: ">=4.1.3"
  cookie: ">=0.7.0 <1.0.0"
  tmp: ">=0.2.4"
